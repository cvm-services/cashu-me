name: Wallet browser E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: wallet-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The shipped PWA defaults to hash routing (static hosts have no server
      # rewrite -- see quasar.config.js). The e2e suite navigates with
      # history-style paths (`page.goto("/settings/privacy")`), so build the
      # test app in history mode to match what the suite asserts. Without this
      # the build is hash-mode, every goto lands on the wrong route, and the
      # ENTIRE suite fails on `wallet-send` not visible.
      VUE_ROUTER_MODE: history

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run unit and store regression tests
        run: npm run test:ci -- --reporter=dot

      - name: Build wallet
        run: npm run build

      - name: Run wallet browser tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-e2e-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
